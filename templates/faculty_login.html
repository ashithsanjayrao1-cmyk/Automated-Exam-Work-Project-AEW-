<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0b0f19; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .bg-shapes { position: absolute; filter: blur(90px); z-index: -1; width: 100%; height: 100%; }
        .shape1 { width: 400px; height: 400px; background: #e84393; border-radius: 50%; position: absolute; top: 0; left: 0; }
        .shape2 { width: 500px; height: 500px; background: #6c5ce7; border-radius: 50%; position: absolute; bottom: 0; right: 0; }
        .login-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 50px 40px; width: 380px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
        input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; margin-bottom: 20px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #e84393; box-shadow: 0 0 15px rgba(232, 67, 147, 0.2); background: rgba(0,0,0,0.4); }
        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #e84393, #6c5ce7); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.05em;}
        .btn-submit:hover { transform: scale(0.95); box-shadow: 0 10px 20px rgba(232, 67, 147, 0.4); }
        .error { color: #ff7675; background: rgba(255,118,117,0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em;}
        .success-msg { color: #00b894; background: rgba(0, 184, 148, 0.1); border: 1px solid rgba(0, 184, 148, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; animation: popIn 0.4s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="bg-shapes"><div class="shape1"></div><div class="shape2"></div></div>
    <div class="login-card">
        <i class="fas fa-chalkboard-teacher" style="font-size: 3em; color: #e84393; margin-bottom: 10px;"></i>
        <h2 style="margin:0 0 5px;">Faculty Portal</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for c, m in messages %}
                <div class="success-msg"><i class="fas fa-check-circle"></i> {{ m }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        {% if error %}<div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}
        
        <form action="/faculty_login" method="POST">
            <input type="email" name="email" placeholder="Faculty Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-submit">Sign In <i class="fas fa-arrow-right"></i></button>
        </form>
        <a href="/faculty_register" style="margin-top:25px; display:block; color:#a0aec0; text-decoration: none;">New Staff? <span style="color:#e84393; font-weight: bold;">Register Here</span></a>
        <a href="/" style="margin-top: 15px; font-size: 0.9em; color: rgba(255,255,255,0.4); display: block; text-decoration: none;"><i class="fas fa-home"></i> Home</a>
    </div>
</body>
</html>
