<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | AEW Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0b0f19; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .bg-shapes { position: absolute; filter: blur(90px); z-index: -1; width: 100%; height: 100%; }
        .shape1 { width: 400px; height: 400px; background: #6c5ce7; border-radius: 50%; position: absolute; top: 0; left: 0; }
        .shape2 { width: 500px; height: 500px; background: #00cec9; border-radius: 50%; position: absolute; bottom: 0; right: 0; }
        .card { background: rgba(255,255,255,0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px 35px; width: 380px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
        input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; margin-bottom: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #6c5ce7, #00cec9); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { transform: scale(0.97); }
        .error { color: #ff7675; background: rgba(255,118,117,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9em; }
        .link { margin-top: 18px; font-size: 0.9em; color: #a0aec0; display: block; text-decoration: none; }
        .link span { color: #00cec9; font-weight: bold; }
    </style>
</head>
<body>
    <div class="bg-shapes"><div class="shape1"></div><div class="shape2"></div></div>
    
    <div class="card">
        <i class="fas fa-key" style="font-size: 2.8em; color: #00cec9; margin-bottom: 10px;"></i>
        <h2 style="margin:0 0 5px;">Reset Password</h2>
        <p style="color: #a0aec0; margin-bottom: 25px; font-size: 0.9em;">Verify your USN &amp; Email to set a new password</p>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <form action="/forgot_password" method="POST">
            <input type="text" name="usn" placeholder="Student USN (e.g. 101)" required>
            <input type="email" name="email" placeholder="Registered Email" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <a href="/student_login" class="link">Remembered password? <span>Back to Login</span></a>
    </div>
</body>
</html>
